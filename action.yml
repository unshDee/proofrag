name: "proofrag"
description: "Evaluate a RAG/LLM app and gate CI on answer quality + retrieval regressions."
branding:
  icon: "check-circle"
  color: "green"

inputs:
  goldenset:
    description: "Path to the golden set JSONL."
    required: true
  predictions:
    description: "Path to predictions JSONL ({id, answer, retrieved_contexts}) from your RAG."
    required: true
  results:
    description: "Where to write results.json."
    default: "results.json"
  scorecard:
    description: "Where to write the HTML scorecard."
    default: "scorecard.html"
  fail-under:
    description: "Fail if overall generation score drops below this (0-1). Empty = no absolute gate."
    default: ""
  baseline:
    description: "Baseline results.json to diff against. Empty = no regression check."
    default: ""
  tolerance:
    description: "Allowed metric drop vs baseline before it counts as a regression."
    default: "0.02"
  k:
    description: "Cutoff k for retrieval metrics (Recall@k, NDCG@k, ...)."
    default: "5"
  semantic:
    description: "Use embedding cosine for chunk relevance (needs the openai extra + key)."
    default: "false"
  exact:
    description: "Require exact chunk equality for retrieval relevance."
    default: "false"
  extra:
    description: "proofrag extra to install or empty for dependency-free Jev scoring."
    default: "anthropic"
  backend:
    description: "Generation scoring backend: proofrag, deepeval, ragas, or jev."
    default: "proofrag"
  model:
    description: "Optional pinned judge model."
    default: ""
  version:
    description: "proofrag package version installed by this Action."
    default: "0.9.0"
  summary:
    description: "Write a markdown score summary to the GitHub Actions job summary."
    default: "true"
  upload-artifact:
    description: "Upload the results JSON and HTML scorecard as a workflow artifact."
    default: "true"
  artifact-name:
    description: "Name for the uploaded scorecard/results artifact."
    default: "proofrag-scorecard"

outputs:
  results:
    description: "Path to the written results.json."
    value: ${{ steps.evaluation.outputs.results }}
  scorecard:
    description: "Path to the written HTML scorecard."
    value: ${{ steps.evaluation.outputs.scorecard }}

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    - name: Evaluate, report, and gate
      id: evaluation
      shell: bash
      env:
        GOLDENSET: ${{ inputs.goldenset }}
        PREDICTIONS: ${{ inputs.predictions }}
        RESULTS: ${{ inputs.results }}
        SCORECARD: ${{ inputs.scorecard }}
        FAIL_UNDER: ${{ inputs.fail-under }}
        BASELINE: ${{ inputs.baseline }}
        TOLERANCE: ${{ inputs.tolerance }}
        K: ${{ inputs.k }}
        SEMANTIC: ${{ inputs.semantic }}
        EXACT: ${{ inputs.exact }}
        EXTRA: ${{ inputs.extra }}
        VERSION: ${{ inputs.version }}
        BACKEND: ${{ inputs.backend }}
        MODEL: ${{ inputs.model }}
      run: |
        set -euo pipefail
        SPEC="proofrag"
        [ -n "$EXTRA" ] && SPEC="proofrag[$EXTRA]"
        [ -n "$VERSION" ] && SPEC="$SPEC==$VERSION"
        RUN=(uvx --from "$SPEC" proofrag)

        # Report only files produced by this run so stale scores cannot escape
        TEMP_RESULTS="$(mktemp)"
        TEMP_SCORECARD="$(mktemp)"
        trap 'rm -f "$TEMP_RESULTS" "$TEMP_SCORECARD"' EXIT
        ARGS=(--goldenset "$GOLDENSET" --predictions "$PREDICTIONS" --out "$TEMP_RESULTS" --k "$K" --backend "$BACKEND")
        [ -n "$MODEL" ] && ARGS+=(--model "$MODEL")
        [ "$SEMANTIC" = "true" ] && ARGS+=(--semantic)
        [ "$EXACT" = "true" ] && ARGS+=(--exact)
        [ -n "$FAIL_UNDER" ] && ARGS+=(--fail-under "$FAIL_UNDER")
        status=0
        "${RUN[@]}" evaluate "${ARGS[@]}" || status=$?

        if [ -s "$TEMP_RESULTS" ]; then
          mv "$TEMP_RESULTS" "$RESULTS"
          echo "generated=true" >> "$GITHUB_OUTPUT"
          echo "results=$RESULTS" >> "$GITHUB_OUTPUT"
          if "${RUN[@]}" report --results "$RESULTS" --out "$TEMP_SCORECARD"; then
            if [ -s "$TEMP_SCORECARD" ]; then
              mv "$TEMP_SCORECARD" "$SCORECARD"
              echo "scorecard=$SCORECARD" >> "$GITHUB_OUTPUT"
            fi
          else
            status=$?
          fi
        fi

        if [ -n "$BASELINE" ] && [ -s "$RESULTS" ] && [ ! -e "$TEMP_RESULTS" ]; then
          "${RUN[@]}" diff --baseline "$BASELINE" --candidate "$RESULTS" --tolerance "$TOLERANCE" || status=$?
        fi

        exit "$status"
    - name: Write score summary
      if: ${{ always() && inputs.summary == 'true' && steps.evaluation.outputs.generated == 'true' }}
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
        EXTRA: ${{ inputs.extra }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        [ -n "${GITHUB_STEP_SUMMARY:-}" ] || exit 0
        [ -f "$RESULTS" ] || exit 0
        SPEC="proofrag"
        [ -n "$EXTRA" ] && SPEC="proofrag[$EXTRA]"
        [ -n "$VERSION" ] && SPEC="$SPEC==$VERSION"
        uvx --from "$SPEC" proofrag summary --results "$RESULTS" --out "$GITHUB_STEP_SUMMARY" --append
    - name: Upload scorecard artifact
      if: ${{ always() && inputs.upload-artifact == 'true' && steps.evaluation.outputs.generated == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.evaluation.outputs.results }}
          ${{ steps.evaluation.outputs.scorecard }}
        if-no-files-found: ignore
