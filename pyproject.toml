# ---- Project Info and Dependencies ----

[project.urls]
Repository = "https://github.com/unshDee/proofrag"
Issues = "https://github.com/unshDee/proofrag/issues"

[project]
name = "proofrag"
description = "Point your agent at your docs and your RAG app; get a golden test set + an LLM-as-judge & retrieval scorecard, in one command."
authors = [
    { name = "Ansh Dawda", email = "ansh.dawda@gmail.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
dynamic = ["version"]
keywords = ["rag", "llm", "evaluation", "llm-as-judge", "agent-skills", "claude", "codex", "retrieval"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# ---- Main dependencies ----
# Core is dependency-free. Pick a backend extra (or use a local OpenAI-compatible server).
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
deepeval = ["deepeval>=4.0.6,<5"]

[project.scripts]
proofrag = "proofrag.cli:main"


# ---- Dev dependencies ----

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-sugar>=1.0",
    "ruff>=0.6",
    "codespell>=2.3",
    "basedpyright>=1.21",
]


# ---- Build system ----

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
# Only full vX.Y.Z release tags set the version; the moving `v0` Action tag is ignored.
pattern = '(?x)^v(?P<base>\d+\.\d+\.\d+)$'

[tool.hatch.build.targets.wheel]
packages = ["src/proofrag"]

[tool.hatch.build.targets.sdist]
# Keep the sdist lean — the demo media (~1 MB) is for the GitHub README, not the package.
exclude = ["docs", "docs/**", ".github", ".github/**", "examples/ci", "examples/ci/**"]


# ---- Settings ----

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "I"]
ignore = ["E501", "E402", "E731"]

[tool.basedpyright]
include = ["src", "tests", "devtools"]
typeCheckingMode = "standard"  # this is JSON-boundary code; full strict adds noise, not safety
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false
reportPrivateUsage = false

[tool.codespell]
skip = "*.lock,./docs/scorecard.png"
# code identifiers that codespell mistakes for typos
ignore-words-list = "ans,nin,fo"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]
