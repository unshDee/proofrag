[project]
name = "proofrag"
version = "0.1.0"
description = "Point your agent at your docs and your RAG app; get a golden test set + an LLM-as-judge & retrieval scorecard, in one command."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ansh Dawda" }]
keywords = ["rag", "llm", "evaluation", "llm-as-judge", "agent-skills", "claude", "codex", "retrieval"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/unshDee/proofrag"
Issues = "https://github.com/unshDee/proofrag/issues"

[project.scripts]
rag-eval = "proofrag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["proofrag*"]
