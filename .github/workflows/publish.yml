name: Publish

# Publishes proofrag to PyPI when a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — configure the publisher once at
# https://pypi.org/manage/project/proofrag/settings/publishing/ (no token needed).

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # uv-dynamic-versioning derives the version from tags
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          test "$VERSION" = "$(python -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          test "$VERSION" = "$(python -c 'import json; print(json.load(open(".claude-plugin/marketplace.json"))["metadata"]["version"])')"
          test "$VERSION" = "$(python -c 'import json; print(json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"])')"
      - name: Build
        run: uv build
      - name: Publish to PyPI
        run: uv publish
